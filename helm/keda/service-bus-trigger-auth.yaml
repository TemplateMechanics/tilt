apiVersion: keda.sh/v1alpha1
kind: ClusterTriggerAuthentication
metadata:
  name: keda-trigger-auth-azure-servicebus
spec:
  # keda-service-bus-secret must already exist in the keda namespace, holding
  # the Service Bus connection string under the key named below.
  secretTargetRef:
    - parameter: connection
      name: keda-service-bus-secret
      key: credential
