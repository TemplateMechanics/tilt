apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: policy-reporter
  namespace: policy-reporter
spec:
  interval: 1m
  chart:
    spec:
      chart: policy-reporter
      # Pinned, not "*": Flux re-resolves an unbounded version on every
      # reconcile, so the platform rebuilt later is not the one built today.
      version: "3.10.0"
      sourceRef:
        kind: HelmRepository
        name: policy-reporter
        namespace: flux-system
  install:
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  values:
    kyvernoPlugin:
      enabled: true
    ui:
      enabled: true
      plugins:
        kyverno: true