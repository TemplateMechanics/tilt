apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: policy-reporter
  namespace: policy-reporter
spec:
  interval: 1m
  chart:
    spec:
      chart: policy-reporter
      # Pinned, not "*": Flux re-resolves an unbounded version on every
      # reconcile, so the platform rebuilt later is not the one built today.
      version: "3.10.0"
      sourceRef:
        kind: HelmRepository
        name: policy-reporter
        namespace: flux-system
  install:
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  values:
    # plugin.kyverno is the 3.x key. This used to set kyvernoPlugin.enabled and
    # ui.plugins.kyverno, the 2.x shape, which 3.10.0 accepts and ignores: the
    # render was byte-identical with them removed, and no plugin Deployment
    # existed. With this key the chart adds policy-reporter-kyverno-plugin and
    # points the UI at it, so no ui.plugins entry is needed.
    plugin:
      kyverno:
        enabled: true
    ui:
      enabled: true