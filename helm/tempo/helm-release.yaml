apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tempo
  namespace: tracing
spec:
  interval: 5m
  chart:
    spec:
      chart: tempo
      # Pinned. A range re-resolves on every Flux reconcile — this is how
      # loki-stack silently ended up shipping a 2022 Loki, and how langfuse
      # jumped a major version and stopped installing.
      version: "1.24.4"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  values:
    persistence:
      enabled: true
      size: 10Gi
