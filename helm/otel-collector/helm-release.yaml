apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opentelemetry-collector
  namespace: opentelemetry
spec:
  interval: 5m
  chart:
    spec:
      chart: opentelemetry-collector
      version: "0.98.0"
      sourceRef:
        kind: HelmRepository
        name: open-telemetry
        namespace: flux-system
  values:
    # Required by this chart: with no repository it refuses to
    # render ("'image.repository' must be set"), so this release had never
    # installed at all. contrib, not core, because the loki exporter below only
    # exists in contrib. The tag defaults to the chart's appVersion, 0.104.0.
    image:
      repository: otel/opentelemetry-collector-contrib
    mode: deployment
    replicaCount: 1
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi
    ports:
      otlp:
        enabled: true
        containerPort: 4317
        servicePort: 4317
        protocol: TCP
      otlp-http:
        enabled: true
        containerPort: 4318
        servicePort: 4318
        protocol: TCP
      prometheus:
        enabled: true
        containerPort: 8889
        servicePort: 8889
        protocol: TCP
      metrics:
        enabled: true
        containerPort: 8888
        servicePort: 8888
        protocol: TCP
    config:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318
      processors:
        batch:
          timeout: 5s
          send_batch_size: 1024
        memory_limiter:
          check_interval: 1s
          limit_mib: 400
          spike_limit_mib: 100
      exporters:
        # Forward traces to Tempo
        otlp/tempo:
          endpoint: tempo.tracing.svc.cluster.local:4317
          tls:
            insecure: true
        # Expose metrics for Prometheus to scrape on the `prometheus` port,
        # which helm/prometheus/servicemonitors/otel-collector.yaml selects.
        # This was prometheusremotewrite to prometheus-server.monitoring, a
        # Service that does not exist here (kube-prometheus-stack names it
        # prometheus-kube-prometheus-prometheus), and the Prometheus CR does
        # not enable the remote-write receiver either. Scraping needs neither.
        prometheus:
          endpoint: 0.0.0.0:8889
        # Forward logs to Loki
        loki:
          endpoint: http://loki.logging.svc.cluster.local:3100/loki/api/v1/push
        # Debug logging
        debug:
          verbosity: basic
      service:
        telemetry:
          metrics:
            address: 0.0.0.0:8888
        pipelines:
          traces:
            receivers: [otlp]
            processors: [memory_limiter, batch]
            exporters: [otlp/tempo]
          metrics:
            receivers: [otlp]
            processors: [memory_limiter, batch]
            exporters: [prometheus]
          logs:
            receivers: [otlp]
            processors: [memory_limiter, batch]
            exporters: [loki]
    # Off: helm/prometheus/servicemonitors/otel-collector.yaml already scrapes
    # this Service. With both, every series is scraped twice and each sum()
    # doubles, the failure the qdrant monitor documents.
    serviceMonitor:
      enabled: false
