---
# ollama is a Flux HelmRelease, not a Crossplane DevApplication, so nothing else
# creates a route for it. Before this file existed the only routing was the
# chart's own Ingress (className: traefik), which stopped being reconciled by
# anything once Traefik was replaced — ollama.localhost would have resolved,
# connected, and returned nothing.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ollama
  namespace: ollama
spec:
  hostnames:
    - ollama.localhost
  parentRefs:
    - name: localhost-gateway
      namespace: istio-system
      kind: Gateway
      group: gateway.networking.k8s.io
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: ollama
          port: 11434
