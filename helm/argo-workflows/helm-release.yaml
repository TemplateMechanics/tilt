apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: argo-workflows
  namespace: argo
spec:
  interval: 5m
  chart:
    spec:
      chart: argo-workflows
      version: "0.45.0"
      sourceRef:
        kind: HelmRepository
        name: argoproj
        namespace: flux-system
  values:
    singleNamespace: false
    workflow:
      serviceAccount:
        create: true
    controller:
      metricsConfig:
        enabled: true
        port: 9090
      resources:
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 100m
          memory: 128Mi
      # No `persistence:` block on purpose. Any controller.persistence value
      # renders a persistence section into the controller configmap, and
      # argo-server then exits with `fatal msg="no databases are configured"`
      # because there is no database under it. `archive: false` did not turn
      # archiving off, it turned on a half-configured one.
    server:
      enabled: true
      authMode: server
      extraArgs:
        - --auth-mode=server
      resources:
        limits:
          cpu: 200m
          memory: 256Mi
        requests:
          cpu: 50m
          memory: 64Mi
