apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opencost
  namespace: opencost
spec:
  interval: 5m
  chart:
    spec:
      chart: opencost
      version: "1.42.0"
      sourceRef:
        kind: HelmRepository
        name: opencost
        namespace: flux-system
  values:
    opencost:
      exporter:
        defaultClusterId: local-dev
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
      prometheus:
        internal:
          enabled: true
          # "prometheus-server" is the service name the standalone prometheus
          # chart creates. This platform runs kube-prometheus-stack, whose
          # service is prometheus-kube-prometheus-prometheus, so the old value
          # resolved to nothing:
          #   dial tcp: lookup prometheus-server.monitoring.svc.cluster.local
          #   on 10.96.0.10:53: no such host
          # OpenCost starts, serves its UI and returns HTTP 200 regardless — the
          # only symptom is "Failed to load report data" inside the page and an
          # empty cost report, which no status-code check would catch.
          serviceName: prometheus-kube-prometheus-prometheus
          namespaceName: monitoring
          port: 9090
      ui:
        enabled: true
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 32Mi
      metrics:
        serviceMonitor:
          enabled: true
