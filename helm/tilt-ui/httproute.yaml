apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tilt
  namespace: tilt-ui
spec:
  hostnames:
    - tilt.localhost
  parentRefs:
    - name: localhost-gateway
      namespace: istio-system
      kind: Gateway
      group: gateway.networking.k8s.io
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: tilt
          port: 80
