apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bookmarks
  namespace: bookmarks
spec:
  hostnames:
    - bookmarks.localhost
  parentRefs:
    - name: localhost-gateway
      namespace: istio-system
      kind: Gateway
      group: gateway.networking.k8s.io
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: bookmarks
          port: 80
