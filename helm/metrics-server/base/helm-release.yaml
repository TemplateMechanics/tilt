---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metrics-server
  namespace: kube-system
spec:
  interval: 1h
  chart:
    spec:
      chart: metrics-server
      version: "3.14.0"
      sourceRef:
        kind: HelmRepository
        name: metrics-server
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
  values:
    # Without metrics-server the Metrics API simply does not exist:
    #   kubectl top nodes -> error: Metrics API not available
    # HorizontalPodAutoscalers and KEDA's resource-based scalers then sit at
    # <unknown>/<target> forever. KEDA is installed on this platform, so this is
    # a real gap rather than a convenience.
    replicas: 1
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 200Mi
    # Single replica on a dev cluster: high availability would only fight for
    # scheduling on a one- or two-node kind cluster.
    podDisruptionBudget:
      enabled: false
