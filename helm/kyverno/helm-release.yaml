apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: kyverno
spec:
  interval: 1m
  chart:
    spec:
      chart: kyverno
      # Pinned, not "*": Flux re-resolves an unbounded version on every
      # reconcile, so the platform rebuilt later is not the one built today.
      version: "3.9.0"
      sourceRef:
        kind: HelmRepository
        name: kyverno
        namespace: flux-system
  install:
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  values:
    rbac:
      create: true
      serviceAccount:
        create: true
        name: kyverno