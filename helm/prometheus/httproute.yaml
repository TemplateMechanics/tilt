---
# Migrated from Traefik (IngressRoute) to Gateway API.
# parentRef points at the shared Gateway in istio-system; the Gateway holds the
# TLS cert, so this route carries no secretName. Under Traefik each app named a
# TLS secret that only existed in the traefik namespace and silently fell back to
# the default cert store — Gateway API removes that failure mode entirely.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  hostnames:
  - grafana.localhost
  parentRefs:
  - name: localhost-gateway
    namespace: istio-system
    kind: Gateway
    group: gateway.networking.k8s.io
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: prometheus-grafana
      port: 80
---
# Prometheus itself, not just Grafana. The README has listed
# https://prometheus.localhost as a service for as long as this file has
# existed, the certificate carries the SAN for it, and the Backstage catalog
# links to it - but nothing routed it, so the documented URL answered 404 while
# every surrounding signal said it was there. Students need PromQL directly,
# not only through a dashboard.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prometheus
  namespace: monitoring
spec:
  hostnames:
  - prometheus.localhost
  parentRefs:
  - name: localhost-gateway
    namespace: istio-system
    kind: Gateway
    group: gateway.networking.k8s.io
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: prometheus-kube-prometheus-prometheus
      port: 9090
