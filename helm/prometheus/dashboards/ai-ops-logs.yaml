---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-ai-ops-logs
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "AI Ops"
data:
  ai-ops-logs.json: |
    {
      "uid": "ai-ops-logs",
      "title": "AI Ops - Log Review",
      "tags": [
        "ai-ops",
        "logs",
        "loki"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "namespace",
            "label": "Namespace",
            "type": "query",
            "datasource": {
              "type": "loki",
              "uid": "loki"
            },
            "query": {
              "label": "namespace",
              "refId": "namespaces",
              "type": 1
            },
            "refresh": 2,
            "multi": true,
            "includeAll": true,
            "allValue": ".+",
            "current": {}
          },
          {
            "name": "level",
            "label": "Level",
            "type": "custom",
            "query": "(?i)(error|fatal|panic|exception|fail),(?i)(warn),(?i)(info),.*",
            "options": [],
            "current": {
              "text": "(?i)(error|fatal|panic|exception|fail)",
              "value": "(?i)(error|fatal|panic|exception|fail)"
            },
            "description": "Severity regex, applied to the logs panel only."
          },
          {
            "name": "search",
            "label": "Search",
            "type": "textbox",
            "query": "",
            "current": {
              "text": "",
              "value": ""
            },
            "description": "Free-text regex filter for the logs panel."
          }
        ]
      },
      "panels": [
        {
          "type": "row",
          "title": "Signal (last 5m)",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 1
          },
          "collapsed": false,
          "panels": []
        },
        {
          "type": "stat",
          "title": "Log lines",
          "description": "Total lines ingested across the selected namespaces.",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "sum(count_over_time({namespace=~\"$namespace\"} [5m]))",
              "queryType": "range"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "color": {
                "mode": "fixed",
                "fixedColor": "#3987e5"
              },
              "mappings": []
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "Errors",
          "description": "Lines matching error/fatal/panic/exception/fail (case-insensitive).",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "x": 6,
            "y": 1,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "sum(count_over_time({namespace=~\"$namespace\"} |~ \"(?i)(error|fatal|panic|exception|fail)\" [5m]))",
              "queryType": "range"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "color": {
                "mode": "fixed",
                "fixedColor": "#d03b3b"
              },
              "mappings": []
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "Warnings",
          "description": "Lines matching warn (case-insensitive).",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "x": 12,
            "y": 1,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "sum(count_over_time({namespace=~\"$namespace\"} |~ \"(?i)(warn)\" [5m]))",
              "queryType": "range"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "color": {
                "mode": "fixed",
                "fixedColor": "#fab219"
              },
              "mappings": []
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "Namespaces w/ errors",
          "description": "How many namespaces are emitting errors. Zero here with a non-zero Errors tile means the source is outside the namespace filter.",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "x": 18,
            "y": 1,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "count(sum by (namespace) (count_over_time({namespace=~\"$namespace\"} |~ \"(?i)(error|fatal|panic|exception|fail)\" [5m])) > 0)",
              "queryType": "range"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "color": {
                "mode": "fixed",
                "fixedColor": "#d03b3b"
              },
              "mappings": []
            },
            "overrides": []
          }
        },
        {
          "type": "row",
          "title": "Trend",
          "gridPos": {
            "x": 0,
            "y": 5,
            "w": 24,
            "h": 1
          },
          "collapsed": false,
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "Log volume - busiest 3 namespaces",
          "description": "Capped at 3 on purpose: the categorical palette validates all-pairs only to 3 slots. A 4th series puts two hues on screen that colourblind readers cannot separate.",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "x": 0,
            "y": 6,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "queryType": "range",
              "legendFormat": "{{namespace}}",
              "expr": "topk(3, sum by (namespace) (rate({namespace=~\"$namespace\"} [$__rate_interval])))"
            }
          ],
          "options": {
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            },
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true,
              "calcs": [
                "max"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 8,
                "showPoints": "never",
                "pointSize": 8,
                "spanNulls": false,
                "axisSoftMin": 0
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byFrameRefID",
                  "options": "A"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "palette-classic"
                    }
                  }
                ]
              }
            ]
          }
        },
        {
          "type": "timeseries",
          "title": "Errors vs warnings",
          "description": "Level is a state, so these use the reserved status colours rather than categorical series slots.",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "x": 12,
            "y": 6,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "queryType": "range",
              "legendFormat": "errors",
              "expr": "sum(rate({namespace=~\"$namespace\"} |~ \"(?i)(error|fatal|panic|exception|fail)\" [$__rate_interval]))"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "queryType": "range",
              "legendFormat": "warnings",
              "expr": "sum(rate({namespace=~\"$namespace\"} |~ \"(?i)(warn)\" [$__rate_interval]))"
            }
          ],
          "options": {
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            },
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true,
              "calcs": [
                "max"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 8,
                "showPoints": "never",
                "pointSize": 8,
                "spanNulls": false,
                "axisSoftMin": 0
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "errors"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#d03b3b"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "warnings"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#fab219"
                    }
                  }
                ]
              }
            ]
          }
        },
        {
          "type": "row",
          "title": "Review",
          "gridPos": {
            "x": 0,
            "y": 14,
            "w": 24,
            "h": 1
          },
          "collapsed": false,
          "panels": []
        },
        {
          "type": "table",
          "title": "Top pods by error count",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "description": "Ranked, so magnitude is read from position and the number is shown directly - colour does not carry the value.",
          "gridPos": {
            "x": 0,
            "y": 15,
            "w": 10,
            "h": 10
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "queryType": "instant",
              "expr": "topk(10, sum by (namespace, pod) (count_over_time({namespace=~\"$namespace\"} |~ \"(?i)(error|fatal|panic|exception|fail)\" [$__range])))"
            }
          ],
          "options": {
            "showHeader": true,
            "sortBy": [
              {
                "displayName": "errors",
                "desc": true
              }
            ],
            "footer": {
              "show": false
            }
          },
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "renameByName": {
                  "Value": "errors"
                }
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                }
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "errors"
                },
                "properties": [
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  },
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#d03b3b"
                    }
                  }
                ]
              }
            ]
          }
        },
        {
          "type": "logs",
          "title": "Recent matching lines",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "description": "Raw lines for the current filters. $level picks the severity regex; $search is free-text on top of it.",
          "gridPos": {
            "x": 10,
            "y": 15,
            "w": 14,
            "h": 10
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "queryType": "range",
              "expr": "{namespace=~\"$namespace\"} |~ \"$level\" |~ \"$search\""
            }
          ],
          "options": {
            "showTime": true,
            "wrapLogMessage": true,
            "prettifyLogMessage": false,
            "enableLogDetails": true,
            "dedupStrategy": "none",
            "sortOrder": "Descending"
          }
        }
      ]
    }
