---
# One dashboard for reviewing the platform: request rate, errors and latency
# from Istio, the log panels underneath, and Tempo trace tables at the bottom -
# all on a single shared time range, so a spike in 5xx, the log lines behind it
# and the traces that carried it are the same window rather than three tabs.
# The traffic row stayed empty for as long as nothing scraped istio-proxy.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-ai-ops-logs
  namespace: monitoring
  labels:
    grafana_dashboard: '1'
  annotations:
    grafana_folder: AI Ops
data:
  ai-ops-logs.json: "{\n  \"uid\": \"ai-ops-logs\",\n  \"title\": \"AI Ops - logs, traces and golden signals\",\n  \"tags\": [\n    \"ai-ops\",\n    \"logs\",\n    \"loki\",\n    \"platform\",\n    \"traces\"\
    \n  ],\n  \"timezone\": \"browser\",\n  \"schemaVersion\": 39,\n  \"version\": 1,\n  \"refresh\": \"30s\",\n  \"time\": {\n    \"from\": \"now-1h\",\n    \"to\": \"now\"\n  },\n  \"templating\": {\n\
    \    \"list\": [\n      {\n        \"name\": \"namespace\",\n        \"label\": \"Namespace\",\n        \"type\": \"query\",\n        \"datasource\": {\n          \"type\": \"loki\",\n          \"uid\"\
    : \"loki\"\n        },\n        \"query\": {\n          \"label\": \"namespace\",\n          \"refId\": \"namespaces\",\n          \"type\": 1\n        },\n        \"refresh\": 2,\n        \"multi\"\
    : true,\n        \"includeAll\": true,\n        \"allValue\": \".+\",\n        \"current\": {}\n      },\n      {\n        \"name\": \"level\",\n        \"label\": \"Level\",\n        \"type\": \"custom\"\
    ,\n        \"query\": \"(?i)(error|fatal|panic|exception|fail),(?i)(warn),(?i)(info),.*\",\n        \"options\": [],\n        \"current\": {\n          \"text\": \"(?i)(error|fatal|panic|exception|fail)\"\
    ,\n          \"value\": \"(?i)(error|fatal|panic|exception|fail)\"\n        },\n        \"description\": \"Severity regex, applied to the logs panel only.\"\n      },\n      {\n        \"name\": \"\
    search\",\n        \"label\": \"Search\",\n        \"type\": \"textbox\",\n        \"query\": \"\",\n        \"current\": {\n          \"text\": \"\",\n          \"value\": \"\"\n        },\n      \
    \  \"description\": \"Free-text regex filter for the logs panel.\"\n      }\n    ]\n  },\n  \"panels\": [\n    {\n      \"title\": \"Traffic and latency (Istio)\",\n      \"type\": \"row\",\n      \"\
    collapsed\": false,\n      \"gridPos\": {\n        \"h\": 1,\n        \"w\": 24,\n        \"x\": 0,\n        \"y\": 0\n      }\n    },\n    {\n      \"title\": \"Request rate by service\",\n      \"\
    type\": \"timeseries\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 8,\n        \"\
    x\": 0,\n        \"y\": 1\n      },\n      \"targets\": [\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"prometheus\"\n          },\n        \
    \  \"expr\": \"sum by (destination_service_name) (rate(istio_requests_total[5m]))\",\n          \"legendFormat\": \"{{destination_service_name}}\",\n          \"refId\": \"A\"\n        }\n      ],\n\
    \      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"reqps\",\n          \"custom\": {\n            \"lineWidth\": 2,\n            \"fillOpacity\": 8\n          }\n        },\n\
    \        \"overrides\": []\n      }\n    },\n    {\n      \"title\": \"5xx rate by service\",\n      \"type\": \"timeseries\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"\
    uid\": \"prometheus\"\n      },\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 8,\n        \"x\": 8,\n        \"y\": 1\n      },\n      \"targets\": [\n        {\n          \"datasource\"\
    : {\n            \"type\": \"prometheus\",\n            \"uid\": \"prometheus\"\n          },\n          \"expr\": \"sum by (destination_service_name) (rate(istio_requests_total{response_code=~\\\"\
    5..\\\"}[5m]))\",\n          \"legendFormat\": \"{{destination_service_name}}\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\"\
    : \"reqps\",\n          \"min\": 0,\n          \"custom\": {\n            \"lineWidth\": 2,\n            \"fillOpacity\": 8\n          }\n        },\n        \"overrides\": []\n      }\n    },\n   \
    \ {\n      \"title\": \"p95 latency by service\",\n      \"type\": \"timeseries\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n      \"gridPos\"\
    : {\n        \"h\": 8,\n        \"w\": 8,\n        \"x\": 16,\n        \"y\": 1\n      },\n      \"targets\": [\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n     \
    \       \"uid\": \"prometheus\"\n          },\n          \"expr\": \"histogram_quantile(0.95, sum by (destination_service_name, le) (rate(istio_request_duration_milliseconds_bucket[5m])))\",\n     \
    \     \"legendFormat\": \"{{destination_service_name}}\",\n          \"refId\": \"A\"\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"ms\",\n         \
    \ \"custom\": {\n            \"lineWidth\": 2,\n            \"fillOpacity\": 0\n          }\n        },\n        \"overrides\": []\n      }\n    },\n    {\n      \"type\": \"row\",\n      \"title\"\
    : \"Signal (last 5m)\",\n      \"gridPos\": {\n        \"x\": 0,\n        \"y\": 9,\n        \"w\": 24,\n        \"h\": 1\n      },\n      \"collapsed\": false,\n      \"panels\": []\n    },\n    {\n\
    \      \"type\": \"stat\",\n      \"title\": \"Log lines\",\n      \"description\": \"Total lines ingested across the selected namespaces.\",\n      \"datasource\": {\n        \"type\": \"loki\",\n\
    \        \"uid\": \"loki\"\n      },\n      \"gridPos\": {\n        \"x\": 0,\n        \"y\": 10,\n        \"w\": 6,\n        \"h\": 4\n      },\n      \"targets\": [\n        {\n          \"refId\"\
    : \"A\",\n          \"datasource\": {\n            \"type\": \"loki\",\n            \"uid\": \"loki\"\n          },\n          \"expr\": \"sum(count_over_time({namespace=~\\\"$namespace\\\"} [5m]))\"\
    ,\n          \"queryType\": \"range\"\n        }\n      ],\n      \"options\": {\n        \"reduceOptions\": {\n          \"calcs\": [\n            \"lastNotNull\"\n          ],\n          \"fields\"\
    : \"\",\n          \"values\": false\n        },\n        \"orientation\": \"auto\",\n        \"textMode\": \"auto\",\n        \"colorMode\": \"value\",\n        \"graphMode\": \"area\",\n        \"\
    justifyMode\": \"auto\"\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"short\",\n          \"decimals\": 0,\n          \"color\": {\n            \"mode\": \"fixed\"\
    ,\n            \"fixedColor\": \"#3987e5\"\n          },\n          \"mappings\": []\n        },\n        \"overrides\": []\n      }\n    },\n    {\n      \"type\": \"stat\",\n      \"title\": \"Errors\"\
    ,\n      \"description\": \"Lines matching error/fatal/panic/exception/fail (case-insensitive).\",\n      \"datasource\": {\n        \"type\": \"loki\",\n        \"uid\": \"loki\"\n      },\n      \"\
    gridPos\": {\n        \"x\": 6,\n        \"y\": 10,\n        \"w\": 6,\n        \"h\": 4\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n      \
    \      \"type\": \"loki\",\n            \"uid\": \"loki\"\n          },\n          \"expr\": \"sum(count_over_time({namespace=~\\\"$namespace\\\"} |~ \\\"(?i)(error|fatal|panic|exception|fail)\\\" [5m]))\"\
    ,\n          \"queryType\": \"range\"\n        }\n      ],\n      \"options\": {\n        \"reduceOptions\": {\n          \"calcs\": [\n            \"lastNotNull\"\n          ],\n          \"fields\"\
    : \"\",\n          \"values\": false\n        },\n        \"orientation\": \"auto\",\n        \"textMode\": \"auto\",\n        \"colorMode\": \"value\",\n        \"graphMode\": \"area\",\n        \"\
    justifyMode\": \"auto\"\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"short\",\n          \"decimals\": 0,\n          \"color\": {\n            \"mode\": \"fixed\"\
    ,\n            \"fixedColor\": \"#d03b3b\"\n          },\n          \"mappings\": []\n        },\n        \"overrides\": []\n      }\n    },\n    {\n      \"type\": \"stat\",\n      \"title\": \"Warnings\"\
    ,\n      \"description\": \"Lines matching warn (case-insensitive).\",\n      \"datasource\": {\n        \"type\": \"loki\",\n        \"uid\": \"loki\"\n      },\n      \"gridPos\": {\n        \"x\"\
    : 12,\n        \"y\": 10,\n        \"w\": 6,\n        \"h\": 4\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"loki\",\n\
    \            \"uid\": \"loki\"\n          },\n          \"expr\": \"sum(count_over_time({namespace=~\\\"$namespace\\\"} |~ \\\"(?i)(warn)\\\" [5m]))\",\n          \"queryType\": \"range\"\n        }\n\
    \      ],\n      \"options\": {\n        \"reduceOptions\": {\n          \"calcs\": [\n            \"lastNotNull\"\n          ],\n          \"fields\": \"\",\n          \"values\": false\n        },\n\
    \        \"orientation\": \"auto\",\n        \"textMode\": \"auto\",\n        \"colorMode\": \"value\",\n        \"graphMode\": \"area\",\n        \"justifyMode\": \"auto\"\n      },\n      \"fieldConfig\"\
    : {\n        \"defaults\": {\n          \"unit\": \"short\",\n          \"decimals\": 0,\n          \"color\": {\n            \"mode\": \"fixed\",\n            \"fixedColor\": \"#fab219\"\n        \
    \  },\n          \"mappings\": []\n        },\n        \"overrides\": []\n      }\n    },\n    {\n      \"type\": \"stat\",\n      \"title\": \"Namespaces w/ errors\",\n      \"description\": \"How\
    \ many namespaces are emitting errors. Zero here with a non-zero Errors tile means the source is outside the namespace filter.\",\n      \"datasource\": {\n        \"type\": \"loki\",\n        \"uid\"\
    : \"loki\"\n      },\n      \"gridPos\": {\n        \"x\": 18,\n        \"y\": 10,\n        \"w\": 6,\n        \"h\": 4\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n    \
    \      \"datasource\": {\n            \"type\": \"loki\",\n            \"uid\": \"loki\"\n          },\n          \"expr\": \"count(sum by (namespace) (count_over_time({namespace=~\\\"$namespace\\\"\
    } |~ \\\"(?i)(error|fatal|panic|exception|fail)\\\" [5m])) > 0)\",\n          \"queryType\": \"range\"\n        }\n      ],\n      \"options\": {\n        \"reduceOptions\": {\n          \"calcs\":\
    \ [\n            \"lastNotNull\"\n          ],\n          \"fields\": \"\",\n          \"values\": false\n        },\n        \"orientation\": \"auto\",\n        \"textMode\": \"auto\",\n        \"\
    colorMode\": \"value\",\n        \"graphMode\": \"area\",\n        \"justifyMode\": \"auto\"\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"short\",\n          \"\
    decimals\": 0,\n          \"color\": {\n            \"mode\": \"fixed\",\n            \"fixedColor\": \"#d03b3b\"\n          },\n          \"mappings\": []\n        },\n        \"overrides\": []\n \
    \     }\n    },\n    {\n      \"type\": \"row\",\n      \"title\": \"Trend\",\n      \"gridPos\": {\n        \"x\": 0,\n        \"y\": 14,\n        \"w\": 24,\n        \"h\": 1\n      },\n      \"collapsed\"\
    : false,\n      \"panels\": []\n    },\n    {\n      \"type\": \"timeseries\",\n      \"title\": \"Log volume - busiest 3 namespaces\",\n      \"description\": \"Capped at 3 on purpose: the categorical\
    \ palette validates all-pairs only to 3 slots. A 4th series puts two hues on screen that colourblind readers cannot separate.\",\n      \"datasource\": {\n        \"type\": \"loki\",\n        \"uid\"\
    : \"loki\"\n      },\n      \"gridPos\": {\n        \"x\": 0,\n        \"y\": 15,\n        \"w\": 12,\n        \"h\": 8\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n    \
    \      \"datasource\": {\n            \"type\": \"loki\",\n            \"uid\": \"loki\"\n          },\n          \"queryType\": \"range\",\n          \"legendFormat\": \"{{namespace}}\",\n        \
    \  \"expr\": \"topk(3, sum by (namespace) (rate({namespace=~\\\"$namespace\\\"} [5m])))\"\n        }\n      ],\n      \"options\": {\n        \"tooltip\": {\n          \"mode\": \"multi\",\n       \
    \   \"sort\": \"desc\"\n        },\n        \"legend\": {\n          \"displayMode\": \"list\",\n          \"placement\": \"bottom\",\n          \"showLegend\": true,\n          \"calcs\": [\n     \
    \       \"max\"\n          ]\n        }\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"short\",\n          \"min\": 0,\n          \"custom\": {\n            \"lineWidth\"\
    : 2,\n            \"fillOpacity\": 8,\n            \"showPoints\": \"never\",\n            \"pointSize\": 8,\n            \"spanNulls\": false,\n            \"axisSoftMin\": 0\n          }\n       \
    \ },\n        \"overrides\": [\n          {\n            \"matcher\": {\n              \"id\": \"byFrameRefID\",\n              \"options\": \"A\"\n            },\n            \"properties\": [\n  \
    \            {\n                \"id\": \"color\",\n                \"value\": {\n                  \"mode\": \"palette-classic\"\n                }\n              }\n            ]\n          }\n  \
    \      ]\n      }\n    },\n    {\n      \"type\": \"timeseries\",\n      \"title\": \"Errors vs warnings\",\n      \"description\": \"Level is a state, so these use the reserved status colours rather\
    \ than categorical series slots.\",\n      \"datasource\": {\n        \"type\": \"loki\",\n        \"uid\": \"loki\"\n      },\n      \"gridPos\": {\n        \"x\": 12,\n        \"y\": 15,\n       \
    \ \"w\": 12,\n        \"h\": 8\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"loki\",\n            \"uid\": \"loki\"\n\
    \          },\n          \"queryType\": \"range\",\n          \"legendFormat\": \"errors\",\n          \"expr\": \"sum(count_over_time({namespace=~\\\"$namespace\\\"} |~ \\\"(?i)(error|fatal|panic|exception|fail)\\\
    \" [5m]))\",\n          \"maxDataPoints\": 60,\n          \"interval\": \"1m\"\n        },\n        {\n          \"refId\": \"B\",\n          \"datasource\": {\n            \"type\": \"loki\",\n   \
    \         \"uid\": \"loki\"\n          },\n          \"queryType\": \"range\",\n          \"legendFormat\": \"warnings\",\n          \"expr\": \"sum(count_over_time({namespace=~\\\"$namespace\\\"} |~\
    \ \\\"(?i)(warn)\\\" [5m]))\",\n          \"maxDataPoints\": 60,\n          \"interval\": \"1m\"\n        }\n      ],\n      \"options\": {\n        \"tooltip\": {\n          \"mode\": \"multi\",\n\
    \          \"sort\": \"desc\"\n        },\n        \"legend\": {\n          \"displayMode\": \"list\",\n          \"placement\": \"bottom\",\n          \"showLegend\": true,\n          \"calcs\": [\n\
    \            \"max\"\n          ]\n        }\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"short\",\n          \"min\": 0,\n          \"custom\": {\n          \
    \  \"lineWidth\": 2,\n            \"fillOpacity\": 8,\n            \"showPoints\": \"never\",\n            \"pointSize\": 8,\n            \"spanNulls\": false,\n            \"axisSoftMin\": 0\n    \
    \      }\n        },\n        \"overrides\": [\n          {\n            \"matcher\": {\n              \"id\": \"byName\",\n              \"options\": \"errors\"\n            },\n            \"properties\"\
    : [\n              {\n                \"id\": \"color\",\n                \"value\": {\n                  \"mode\": \"fixed\",\n                  \"fixedColor\": \"#d03b3b\"\n                }\n   \
    \           }\n            ]\n          },\n          {\n            \"matcher\": {\n              \"id\": \"byName\",\n              \"options\": \"warnings\"\n            },\n            \"properties\"\
    : [\n              {\n                \"id\": \"color\",\n                \"value\": {\n                  \"mode\": \"fixed\",\n                  \"fixedColor\": \"#fab219\"\n                }\n   \
    \           }\n            ]\n          }\n        ]\n      },\n      \"maxDataPoints\": 60,\n      \"interval\": \"1m\"\n    },\n    {\n      \"type\": \"row\",\n      \"title\": \"Review\",\n    \
    \  \"gridPos\": {\n        \"x\": 0,\n        \"y\": 23,\n        \"w\": 24,\n        \"h\": 1\n      },\n      \"collapsed\": false,\n      \"panels\": []\n    },\n    {\n      \"type\": \"table\"\
    ,\n      \"title\": \"Top pods by error count\",\n      \"datasource\": {\n        \"type\": \"loki\",\n        \"uid\": \"loki\"\n      },\n      \"description\": \"Ranked, so magnitude is read from\
    \ position and the number is shown directly - colour does not carry the value.\",\n      \"gridPos\": {\n        \"x\": 0,\n        \"y\": 24,\n        \"w\": 10,\n        \"h\": 10\n      },\n    \
    \  \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"loki\",\n            \"uid\": \"loki\"\n          },\n          \"queryType\": \"instant\"\
    ,\n          \"expr\": \"topk(10, sum by (namespace, pod) (count_over_time({namespace=~\\\"$namespace\\\"} |~ \\\"(?i)(error|fatal|panic|exception|fail)\\\" [$__range])))\"\n        }\n      ],\n  \
    \    \"options\": {\n        \"showHeader\": true,\n        \"sortBy\": [\n          {\n            \"displayName\": \"errors\",\n            \"desc\": true\n          }\n        ],\n        \"footer\"\
    : {\n          \"show\": false\n        }\n      },\n      \"transformations\": [\n        {\n          \"id\": \"organize\",\n          \"options\": {\n            \"excludeByName\": {\n          \
    \    \"Time\": true\n            },\n            \"renameByName\": {\n              \"Value\": \"errors\"\n            }\n          }\n        }\n      ],\n      \"fieldConfig\": {\n        \"defaults\"\
    : {\n          \"custom\": {\n            \"align\": \"auto\",\n            \"cellOptions\": {\n              \"type\": \"auto\"\n            }\n          }\n        },\n        \"overrides\": [\n \
    \         {\n            \"matcher\": {\n              \"id\": \"byName\",\n              \"options\": \"errors\"\n            },\n            \"properties\": [\n              {\n                \"\
    id\": \"custom.cellOptions\",\n                \"value\": {\n                  \"type\": \"color-text\"\n                }\n              },\n              {\n                \"id\": \"color\",\n  \
    \              \"value\": {\n                  \"mode\": \"fixed\",\n                  \"fixedColor\": \"#d03b3b\"\n                }\n              }\n            ]\n          }\n        ]\n      }\n\
    \    },\n    {\n      \"type\": \"logs\",\n      \"title\": \"Recent matching lines\",\n      \"datasource\": {\n        \"type\": \"loki\",\n        \"uid\": \"loki\"\n      },\n      \"description\"\
    : \"Raw lines for the current filters. $level picks the severity regex; $search is free-text on top of it.\",\n      \"gridPos\": {\n        \"x\": 10,\n        \"y\": 24,\n        \"w\": 14,\n    \
    \    \"h\": 10\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"loki\",\n            \"uid\": \"loki\"\n          },\n  \
    \        \"queryType\": \"range\",\n          \"expr\": \"{namespace=~\\\"$namespace\\\"} |~ \\\"$level\\\" |~ \\\"$search\\\"\"\n        }\n      ],\n      \"options\": {\n        \"showTime\": true,\n\
    \        \"wrapLogMessage\": true,\n        \"prettifyLogMessage\": false,\n        \"enableLogDetails\": true,\n        \"dedupStrategy\": \"none\",\n        \"sortOrder\": \"Descending\"\n      }\n\
    \    },\n    {\n      \"title\": \"Traces\",\n      \"type\": \"row\",\n      \"collapsed\": false,\n      \"gridPos\": {\n        \"h\": 1,\n        \"w\": 24,\n        \"x\": 0,\n        \"y\": 34\n\
    \      }\n    },\n    {\n      \"title\": \"Slowest traces (>250ms)\",\n      \"type\": \"table\",\n      \"datasource\": {\n        \"type\": \"tempo\",\n        \"uid\": \"tempo\"\n      },\n    \
    \  \"gridPos\": {\n        \"h\": 9,\n        \"w\": 12,\n        \"x\": 0,\n        \"y\": 35\n      },\n      \"targets\": [\n        {\n          \"datasource\": {\n            \"type\": \"tempo\"\
    ,\n            \"uid\": \"tempo\"\n          },\n          \"queryType\": \"traceql\",\n          \"query\": \"{ duration > 250ms }\",\n          \"limit\": 20,\n          \"refId\": \"A\"\n       \
    \ }\n      ]\n    },\n    {\n      \"title\": \"Traces with errors\",\n      \"type\": \"table\",\n      \"datasource\": {\n        \"type\": \"tempo\",\n        \"uid\": \"tempo\"\n      },\n     \
    \ \"gridPos\": {\n        \"h\": 9,\n        \"w\": 12,\n        \"x\": 12,\n        \"y\": 35\n      },\n      \"targets\": [\n        {\n          \"datasource\": {\n            \"type\": \"tempo\"\
    ,\n            \"uid\": \"tempo\"\n          },\n          \"queryType\": \"traceql\",\n          \"query\": \"{ status = error }\",\n          \"limit\": 20,\n          \"refId\": \"A\"\n        }\n\
    \      ]\n    }\n  ]\n}"
