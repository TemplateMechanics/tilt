apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: loki
  namespace: monitoring
  labels:
    app: loki
spec:
  selector:
    matchLabels:
      # app.kubernetes.io/name, not app: the loki chart stopped setting a bare
      # `app` label, so this selector matched nothing and every panel on the
      # Loki dashboard was empty while Loki itself was healthy.
      app.kubernetes.io/name: loki
  namespaceSelector:
    matchNames:
      - logging
  endpoints:
    - port: http-metrics
      path: /metrics
      interval: 30s
