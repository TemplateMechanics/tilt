apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: argo-workflows
  namespace: monitoring
  labels:
    release: prometheus
spec:
  namespaceSelector:
    matchNames:
      - argo
  selector:
    matchLabels:
      # ...-workflow-controller, not ...-controller. The chart names the service
      # argo-workflows-workflow-controller; with the short name this selector
      # matched nothing and argo_workflows_* had zero series in Prometheus.
      app.kubernetes.io/name: argo-workflows-workflow-controller
  endpoints:
    - port: metrics
      interval: 30s
