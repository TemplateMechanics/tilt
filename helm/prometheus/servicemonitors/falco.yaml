apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: falco
  namespace: monitoring
  labels:
    app.kubernetes.io/name: falco
spec:
  # falco-exporter was a separate chart; Falco 7.x serves metrics itself from
  # the falco-metrics Service, so the old selector matched nothing and Falco's
  # metrics were never scraped while the monitor sat there looking configured.
  # Only that Service carries the `type` label.
  selector:
    matchLabels:
      app.kubernetes.io/name: falco
      type: falco-metrics
  namespaceSelector:
    matchNames:
      - falco
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: falcosidekick
  namespace: monitoring
  labels:
    app.kubernetes.io/name: falcosidekick
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: falcosidekick
  namespaceSelector:
    matchNames:
      - falco
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
