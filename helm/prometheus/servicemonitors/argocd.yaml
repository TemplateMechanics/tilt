apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: argocd-metrics
  namespace: monitoring
  labels:
    release: prometheus
spec:
  namespaceSelector:
    matchNames:
      - argocd
  selector:
    matchLabels:
      app.kubernetes.io/part-of: argocd
  endpoints:
    # http-metrics, not metrics. Every argocd *-metrics service names its port
    # http-metrics; with the wrong name the monitor selected the services and
    # scraped nothing, and the Argo CD dashboard was empty in all 18 panels.
    - port: http-metrics
      interval: 30s
      path: /metrics
