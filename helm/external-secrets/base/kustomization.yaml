---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Operator only. The ClusterSecretStore and a worked ExternalSecret live in
# ../stores, which depends on the CRDs this release installs — same split as
# cert-manager/base vs cert-manager/pki, and for the same reason.
resources:
  - namespace.yaml
  - helm-repo.yaml
  - helm-release.yaml
