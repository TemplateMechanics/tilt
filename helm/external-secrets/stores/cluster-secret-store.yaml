---
# A working store, deliberately, rather than installing the operator with nothing
# behind it. An operator with no SecretStore reconciles nothing: it reports
# healthy, and every ExternalSecret anyone writes sits in SecretSyncedError
# forever. That is the configured-but-inert failure this platform keeps hitting.
#
# The `fake` provider serves values from this manifest. It proves the operator,
# its webhook and the CRDs actually work end to end, and gives a template whose
# only change for a real backend is spec.provider.
#
# It is NOT a secret manager. Values here are as public as any other file in the
# repo — this exists to demonstrate wiring, never to hold a real credential.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: dev-fake
spec:
  provider:
    fake:
      data:
        - key: /dev/demo/username
          value: demo-user
        - key: /dev/demo/password
          value: demo-password-not-secret
---
