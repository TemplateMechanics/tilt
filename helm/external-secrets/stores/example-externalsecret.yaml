---
# Proves the whole path works: operator -> ClusterSecretStore -> materialised
# Secret. If this ExternalSecret is not Ready, ESO is not functioning, and every
# other ExternalSecret would fail the same way.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: demo-credentials
  namespace: external-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: dev-fake
  target:
    name: demo-credentials
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: /dev/demo/username
    - secretKey: password
      remoteRef:
        key: /dev/demo/password
