apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dapr
  namespace: dapr-system
spec:
  interval: 5m
  chart:
    spec:
      chart: dapr
      version: "1.14.4"
      sourceRef:
        kind: HelmRepository
        name: dapr
        namespace: flux-system
  values:
    global:
      mtls:
        enabled: false
      ha:
        enabled: false
      prometheus:
        enabled: true
        port: 9090
      logAsJson: true
    # dapr_dashboard is deliberately absent. This chart no longer ships the
    # dashboard and accepted the key while creating nothing, so the HTTPRoute
    # reported BackendNotFound while every dapr component looked healthy. The
    # dashboard is now its own release: helm-release-dashboard.yaml.
    dapr_sidecar_injector:
      enabled: true
      sidecarRunAsNonRoot: true
    # No enabled or replicaCount: chart 1.14.4 always installs placement and
    # sentry, and placement's replica count follows global.ha.enabled (off
    # here, so 1). Both keys were ignored; changing them left the render
    # identical.
    dapr_placement:
      runAsNonRoot: true
    dapr_operator:
      runAsNonRoot: true
    dapr_sentry:
      runAsNonRoot: true
