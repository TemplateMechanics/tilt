---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: harbor
  namespace: harbor
spec:
  interval: 5m
  chart:
    spec:
      chart: harbor
      version: ">=1.15.0"
      sourceRef:
        kind: HelmRepository
        name: harbor
        namespace: flux-system
  values:
    expose:
      # clusterIP, not ingress: routing is owned by the Gateway API HTTPRoute the
      # Crossplane DevApplication composition creates. With type: ingress the
      # chart renders an Ingress with className "traefik", which no controller
      # reconciles under Istio — it would sit there looking configured.
      # TLS terminates at the Gateway, so it stays disabled on the chart.
      type: clusterIP
      tls:
        enabled: false
    externalURL: http://harbor.localhost
    harborAdminPassword: "P@ssw0rd"
    trivy:
      enabled: false
    database:
      type: internal
    redis:
      type: internal
    persistence:
      persistentVolumeClaim:
        registry:
          size: 5Gi
        database:
          size: 1Gi
        redis:
          size: 1Gi