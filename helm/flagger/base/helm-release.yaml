---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flagger
  namespace: istio-system
spec:
  interval: 1h
  chart:
    spec:
      chart: flagger
      version: "1.45.0"
      sourceRef:
        kind: HelmRepository
        name: flagger
        namespace: flux-system
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
  values:
    # gatewayapi:v1 — not "istio". Flagger's istio provider drives Istio
    # VirtualServices, which is the wrong API here: this platform routes with
    # Gateway API HTTPRoutes, and Istio compiles those into its own
    # autogenerated VirtualServices. Pointing Flagger at the istio provider
    # would have it write VirtualServices that never take effect, the same way
    # the hand-written CORS VirtualService did not.
    meshProvider: "gatewayapi:v1"

    # Canary analysis is driven by metrics, so Flagger needs the Prometheus that
    # actually exists here. The chart default assumes a prometheus in its own
    # namespace; wrong address means every canary stalls waiting for metrics
    # that never arrive, and reports no error while doing it.
    metricsServer: http://prometheus-kube-prometheus-prometheus.monitoring:9090

    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 500m
        memory: 512Mi

    # No Slack/Teams webhook on a local platform; alerts go to the events log.
    slack:
      enabled: false
