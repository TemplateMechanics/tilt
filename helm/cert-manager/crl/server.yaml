---
apiVersion: v1
kind: ConfigMap
metadata:
  name: local-ca-crl-server
  namespace: istio-system
data:
  server.py: |
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    from pathlib import Path

    CRL_DIR = Path("/var/run/local-ca-crls")
    FILES = {
        "/root.crl": CRL_DIR / "root.crl",
        "/intermediate.crl": CRL_DIR / "intermediate.crl",
    }

    class Handler(BaseHTTPRequestHandler):
        def _send(self, include_body):
            if self.path == "/healthz":
                body = b"ok\n"
                content_type = "text/plain; charset=utf-8"
            elif self.path in FILES:
                try:
                    body = FILES[self.path].read_bytes()
                except OSError:
                    self.send_error(503, "CRL not published")
                    return
                content_type = "application/pkix-crl"
            else:
                self.send_error(404)
                return

            self.send_response(200)
            self.send_header("Content-Type", content_type)
            # This is a local development PKI. A regenerated CRL must be used
            # immediately rather than hidden behind a browser cache.
            self.send_header("Cache-Control", "no-cache, max-age=0, must-revalidate")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            if include_body:
                self.wfile.write(body)

        def do_GET(self):
            self._send(True)

        def do_HEAD(self):
            self._send(False)

    ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-ca-crl-server
  namespace: istio-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: local-ca-crl-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: local-ca-crl-server
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: python:3.12-slim@sha256:2f17fc044b579bab302c2e8054d3a686e2cb9a83de48e70534b94cd8ebbe06a9
          imagePullPolicy: IfNotPresent
          command: ["python", "/opt/local-ca-crl/server.py"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: server
              mountPath: /opt/local-ca-crl
              readOnly: true
            - name: crls
              mountPath: /var/run/local-ca-crls
              readOnly: true
      volumes:
        - name: server
          configMap:
            name: local-ca-crl-server
        - name: crls
          configMap:
            name: local-ca-crls
---
apiVersion: v1
kind: Service
metadata:
  name: local-ca-crl-server
  namespace: istio-system
spec:
  selector:
    app.kubernetes.io/name: local-ca-crl-server
  ports:
    - name: http
      port: 80
      targetPort: http
