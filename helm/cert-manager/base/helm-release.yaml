---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 1h
  chart:
    spec:
      chart: cert-manager
      version: "v1.16.2"
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
  values:
    # Install CRDs
    installCRDs: true
    
    # DNS01 recursive nameservers
    dns01RecursiveNameserversOnly: true
    dns01RecursiveNameservers: "8.8.8.8:53,1.1.1.1:53"
    
    # ServiceMonitor is deliberately OFF here and enabled by the
    # components/servicemonitor overlay instead.
    # The chart renders a monitoring.coreos.com/v1 ServiceMonitor when this is
    # true, so with it on, `helm install` FAILS OUTRIGHT on any cluster where
    # the Prometheus Operator CRDs are not already present:
    #   no matches for kind "ServiceMonitor" in version "monitoring.coreos.com/v1"
    # That made cert-manager uninstallable on a fresh cluster. Only apply the
    # component once Prometheus is reconciled.
    prometheus:
      enabled: true
      servicemonitor:
        enabled: false
        
    # Resources for local dev
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi
        
    # Webhook resources
    webhook:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi
          
    # CA Injector resources
    cainjector:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi
