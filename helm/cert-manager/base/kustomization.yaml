---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Install layer ONLY. The ClusterIssuers and Certificates live in ../pki because
# they are instances of CRDs that this HelmRelease installs. Keeping them here
# makes every first apply on a fresh cluster fail with
# 'no matches for kind "ClusterIssuer"' — the CRDs do not exist until after this
# release reconciles. Apply pki/ once cert-manager is Ready.
resources:
  - namespace.yaml
  - helm-release.yaml
