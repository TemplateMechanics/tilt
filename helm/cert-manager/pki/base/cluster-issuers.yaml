---
# Bootstrap issuer. Exists only to sign the root CA below — a self-signed issuer
# cannot be used for leaf certs because nothing would chain to it.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-bootstrap
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: local-root-ca
spec:
  ca:
    secretName: local-root-ca
    # The intermediate certificate points here. Managed Chrome can require an
    # online revocation result even for a locally installed trust anchor.
    crlDistributionPoints:
      - http://crl.localhost/root.crl
---
# Leaf certs are signed by the intermediate, never the root. The root key then
# only ever signs one thing, so rotating a leaf never touches the CA that is
# installed in the developer's OS trust store.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: local-intermediate-ca
spec:
  ca:
    secretName: local-intermediate-ca
    # Every leaf issued by this ClusterIssuer points at the leaf CRL.
    crlDistributionPoints:
      - http://crl.localhost/intermediate.crl
