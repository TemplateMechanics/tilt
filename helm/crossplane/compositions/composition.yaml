---
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: devapplication
  labels:
    crossplane.io/xrd: xdevapplications.devplatform.systechs.io
spec:
  compositeTypeRef:
    apiVersion: devplatform.systechs.io/v1alpha1
    kind: XDevApplication
  
  resources:
    # 1. Create Namespace
    - name: namespace
      base:
        apiVersion: kubernetes.crossplane.io/v1alpha2
        kind: Object
        spec:
          forProvider:
            manifest:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: placeholder
                labels:
                  # Scaffolded apps join the ambient mesh automatically, so they
                  # get mTLS and L4 telemetry without the author doing anything.
                  # Omitting it is invisible: the app works, and is simply absent
                  # from the mesh and from Kiali's data plane count.
                  istio.io/dataplane-mode: ambient
      patches:
        - type: FromCompositeFieldPath
          fromFieldPath: spec.name
          toFieldPath: spec.forProvider.manifest.metadata.name
        # Overrides the "ambient" default above. Without this patch the XRD
        # field would exist and change nothing - a setting accepted and
        # silently ignored, which is the failure shape this repo keeps
        # tripping over.
        - type: FromCompositeFieldPath
          fromFieldPath: spec.dataplaneMode
          toFieldPath: spec.forProvider.manifest.metadata.labels["istio.io/dataplane-mode"]
    
    # 2. Deploy Helm Release via Flux
    - name: helmrelease
      base:
        apiVersion: kubernetes.crossplane.io/v1alpha2
        kind: Object
        spec:
          forProvider:
            manifest:
              apiVersion: helm.toolkit.fluxcd.io/v2
              kind: HelmRelease
              metadata:
                name: placeholder
                namespace: placeholder
              spec:
                interval: 5m
                chart:
                  spec:
                    chart: placeholder
                    version: "*"
                    sourceRef:
                      kind: HelmRepository
                      name: placeholder
                      namespace: flux-system
                values: {}
      patches:
        - type: FromCompositeFieldPath
          fromFieldPath: spec.name
          toFieldPath: spec.forProvider.manifest.metadata.name
        - type: FromCompositeFieldPath
          fromFieldPath: spec.name
          toFieldPath: spec.forProvider.manifest.metadata.namespace
        - type: FromCompositeFieldPath
          fromFieldPath: spec.chart.name
          toFieldPath: spec.forProvider.manifest.spec.chart.spec.chart
        - type: FromCompositeFieldPath
          fromFieldPath: spec.chart.version
          toFieldPath: spec.forProvider.manifest.spec.chart.spec.version
        - type: FromCompositeFieldPath
          fromFieldPath: spec.chart.repository
          toFieldPath: spec.forProvider.manifest.spec.chart.spec.sourceRef.name
        - type: FromCompositeFieldPath
          fromFieldPath: spec.chart.values
          toFieldPath: spec.forProvider.manifest.spec.values
          # No mergeOptions.keepMapValues here, deliberately.
          #
          # With keepMapValues: true the patch MERGES into whatever the
          # HelmRelease already has and keeps the existing value on any key that
          # is already set. Editing a value in a DevApplication then has no
          # effect: the DevApplication and the XR both show the new value while
          # the generated HelmRelease keeps the old one, and nothing anywhere
          # reports a conflict. Observed with langfuse — clickhouse.auth.username
          # was corrected to "default" in apps/langfuse.yaml, the XR carried
          # "default", and the HelmRelease still had "langfuse", so the release
          # kept failing to install with the error the fix was meant to resolve.
          #
          # Without it the values map is replaced, so edits actually apply. New
          # keys are still added; the only thing lost is the ability to change a
          # value out-of-band on the HelmRelease and have it survive, which is
          # drift the platform should not be preserving anyway.
    
    # 3. Create Gateway API HTTPRoute
    #
    # DROPPED IN MIGRATION: the Traefik IngressRoute attached a `security`
    # Middleware (traefik ns) setting CORS headers for any method/header and
    # origins matching https?://(.*)?.localhost$. There is no equivalent here.
    # Called out rather than silently dropped, because a missing CORS header
    # surfaces as an opaque browser console error, not a routing failure.
    #
    # Both obvious workarounds were tried on a live cluster and neither works:
    #
    #   - An HTTPRoute `cors` filter is rejected by the installed CRDs:
    #       strict decoding error: unknown field "spec.rules[0].filters[0].cors"
    #     CORS lives in Gateway API's EXPERIMENTAL channel; this platform
    #     installs the standard channel (v1.3.0).
    #   - A hand-written Istio VirtualService with a corsPolicy does not attach.
    #     Istio compiles Gateway API routes into its own autogenerated
    #     VirtualServices (istio-autogenerated-k8s-gateway~http~<host>), and a
    #     separate VirtualService for the same host neither merges with nor
    #     overrides them — with the HTTPRoute present it is ignored, and without
    #     it every request 404s.
    #
    # So the options are: switch the Gateway API CRDs to the experimental
    # channel and use the `cors` filter, or handle CORS in the application.
    # Deliberately not switching channels here — that trades a stable API for
    # the whole platform to restore one policy, and is a call to make
    # explicitly rather than as a side effect of this migration.
    - name: httproute
      base:
        apiVersion: kubernetes.crossplane.io/v1alpha2
        kind: Object
        spec:
          forProvider:
            manifest:
              apiVersion: gateway.networking.k8s.io/v1
              kind: HTTPRoute
              metadata:
                name: placeholder
                namespace: placeholder
              spec:
                hostnames:
                  - placeholder.localhost
                parentRefs:
                  - name: localhost-gateway
                    namespace: istio-system
                    kind: Gateway
                    group: gateway.networking.k8s.io
                rules:
                  - matches:
                      - path:
                          type: PathPrefix
                          value: /
                    # No namespace on the backendRef: the HTTPRoute is created in
                    # the app's own namespace, so this stays a same-namespace
                    # reference and needs no ReferenceGrant.
                    backendRefs:
                      - name: placeholder
                        port: 80
      patches:
        - type: FromCompositeFieldPath
          fromFieldPath: spec.name
          toFieldPath: spec.forProvider.manifest.metadata.name
        - type: FromCompositeFieldPath
          fromFieldPath: spec.name
          toFieldPath: spec.forProvider.manifest.metadata.namespace
        - type: FromCompositeFieldPath
          fromFieldPath: spec.domain
          toFieldPath: spec.forProvider.manifest.spec.hostnames[0]
        # Default service name to spec.name (applied first)
        - type: FromCompositeFieldPath
          fromFieldPath: spec.name
          toFieldPath: spec.forProvider.manifest.spec.rules[0].backendRefs[0].name
        # Override with explicit serviceName if provided (applied second, wins)
        - type: FromCompositeFieldPath
          fromFieldPath: spec.ingress.serviceName
          toFieldPath: spec.forProvider.manifest.spec.rules[0].backendRefs[0].name
          policy:
            fromFieldPath: Optional
        - type: FromCompositeFieldPath
          fromFieldPath: spec.ingress.servicePort
          toFieldPath: spec.forProvider.manifest.spec.rules[0].backendRefs[0].port
    
    # 4. Create ServiceMonitor for Prometheus (if monitoring.metrics enabled)
    - name: servicemonitor
      base:
        apiVersion: kubernetes.crossplane.io/v1alpha2
        kind: Object
        spec:
          forProvider:
            manifest:
              apiVersion: monitoring.coreos.com/v1
              kind: ServiceMonitor
              metadata:
                name: placeholder
                namespace: placeholder
                labels:
                  app: placeholder
              spec:
                selector:
                  matchLabels:
                    app.kubernetes.io/name: placeholder
                endpoints:
                  - port: metrics
                    path: /metrics
                    interval: 30s
      patches:
        - type: FromCompositeFieldPath
          fromFieldPath: spec.name
          toFieldPath: spec.forProvider.manifest.metadata.name
        - type: FromCompositeFieldPath
          fromFieldPath: spec.name
          toFieldPath: spec.forProvider.manifest.metadata.namespace
        - type: FromCompositeFieldPath
          fromFieldPath: spec.name
          toFieldPath: spec.forProvider.manifest.metadata.labels.app
        - type: FromCompositeFieldPath
          fromFieldPath: spec.name
          toFieldPath: spec.forProvider.manifest.spec.selector.matchLabels["app.kubernetes.io/name"]
        - type: FromCompositeFieldPath
          fromFieldPath: spec.monitoring.metricsPath
          toFieldPath: spec.forProvider.manifest.spec.endpoints[0].path
