---
apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: xdevapplications.devplatform.systechs.io
spec:
  group: devplatform.systechs.io
  names:
    kind: XDevApplication
    plural: xdevapplications
  claimNames:
    kind: DevApplication
    plural: devapplications
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                # Basic app info
                name:
                  type: string
                  description: "Application name (used for namespace, ingress, etc.)"
                domain:
                  type: string
                  description: "Domain for ingress (e.g., myapp.localhost)"

                # Ambient membership, stated rather than assumed. "none" is an
                # explicit Istio value, not the absence of a label: an app that is
                # out of the mesh should say so, because a missing label and a
                # deliberate exclusion look identical on a cluster.
                dataplaneMode:
                  type: string
                  enum: ["ambient", "none"]
                  default: "ambient"
                  description: "istio.io/dataplane-mode for the app namespace. Use none for apps whose internal TCP breaks under ambient."
                
                # Helm chart configuration
                chart:
                  type: object
                  description: "Helm chart configuration"
                  properties:
                    repository:
                      type: string
                      description: "HelmRepository name in flux-system namespace"
                    name:
                      type: string
                      description: "Chart name"
                    version:
                      type: string
                      description: "Chart version (use '*' for latest)"
                      default: "*"
                    values:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                      description: "Helm values"
                  required:
                    - repository
                    - name
                
                # Ingress configuration
                ingress:
                  type: object
                  description: "Ingress configuration"
                  properties:
                    enabled:
                      type: boolean
                      default: true
                      description: "Not read by the Composition: setting it changes nothing. The HTTPRoute is always created."
                    serviceName:
                      type: string
                      description: "Service name to route traffic to (defaults to app name)"
                    servicePort:
                      type: integer
                      description: "Service port"
                      default: 80
                    alternativeDomains:
                      description: "Not read by the Composition: setting it changes nothing. The HTTPRoute serves spec.domain only."
                      type: array
                      items:
                        type: string
                
                # Monitoring configuration
                monitoring:
                  type: object
                  description: "Monitoring configuration"
                  properties:
                    enabled:
                      type: boolean
                      default: true
                      description: "Not read by the Composition: setting it changes nothing. The ServiceMonitor is always created."
                    metrics:
                      type: boolean
                      default: true
                      description: "Not read by the Composition: setting it changes nothing."
                    logs:
                      type: boolean
                      default: true
                      description: "Not read by the Composition: setting it changes nothing."
                    traces:
                      type: boolean
                      default: false
                      description: "Not read by the Composition: setting it changes nothing."
                    metricsPort:
                      type: integer
                      default: 9090
                      description: "Not read by the Composition: setting it changes nothing."
                    metricsPath:
                      type: string
                      default: "/metrics"
              
              required:
                - name
                - domain
                - chart
