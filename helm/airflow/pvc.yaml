apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: airflow-dags
  namespace: airflow
spec:
  # ReadWriteOnce, not ReadWriteMany: kind's local-path provisioner supports
  # RWO only and rejects an RWX claim with "NodePath only supports
  # ReadWriteOnce". Both airflow pods mount this, so they are pinned to one
  # node by the podAffinity in scheduler.yaml and webserver.yaml.
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: airflow-logs
  namespace: airflow
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
