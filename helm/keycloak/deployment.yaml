apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
      - name: keycloak
        image: quay.io/keycloak/keycloak:24.0
        args: ["start-dev", "--health-enabled=true"]
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: KEYCLOAK_ADMIN
          value: "admin"
        - name: KEYCLOAK_ADMIN_PASSWORD
          value: "admin"
        - name: KC_PROXY
          value: "edge"
        - name: KC_HOSTNAME
          value: "auth.localhost"
        - name: KC_HOSTNAME_STRICT
          value: "false"
        - name: KC_HTTP_ENABLED
          value: "true"
        - name: KC_DB
          value: "postgres"
        - name: KC_DB_URL
          value: "jdbc:postgresql://keycloak-postgresql:5432/kc_db"
        # Cap the heap below the container limit. Left unset the JVM sizes itself
        # from the cgroup limit, and the start-up build can then push the whole
        # container past it and be killed again.
        - name: JAVA_OPTS_KC_HEAP
          value: "-Xms512m -Xmx1536m"
        - name: KC_DB_USERNAME
          value: "kc_user"
        - name: KC_DB_PASSWORD
          value: "kc-dev-password"
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          # 2Gi was not enough: the container was OOMKilled with exit 137 on
          # every start, eight restarts deep, while Keycloak 24 ran its Quarkus
          # augmentation build. The build peaks well above the steady state.
          limits:
            cpu: 2000m
            memory: 3Gi
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 10
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          initialDelaySeconds: 120
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 10
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: keycloak
spec:
  selector:
    app: keycloak
  ports:
  - port: 80
    targetPort: 8080
