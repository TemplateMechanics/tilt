---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istio-base
  namespace: istio-system
spec:
  interval: 1h
  chart:
    spec:
      chart: base
      version: "1.28.3"
      sourceRef:
        kind: HelmRepository
        name: istio
        namespace: flux-system
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
  values:
    defaultRevision: default
