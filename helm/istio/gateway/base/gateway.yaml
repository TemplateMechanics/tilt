---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: localhost-gateway
  namespace: istio-system
spec:
  gatewayClassName: istio
  listeners:
    - name: http
      hostname: "*.localhost"
      port: 80
      protocol: HTTP
      # Only istio-system may attach routes here, and the only route in it is
      # the 301 to HTTPS. This restriction is what actually forces TLS: an app
      # HTTPRoute names an exact hostname, which is more specific than the
      # redirect's "*.localhost", so under `from: All` the app wins on port 80
      # and keeps serving plaintext while a redirect sits beside it doing
      # nothing at all.
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      hostname: "*.localhost"
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            group: ""
            name: wildcard-localhost-tls
      allowedRoutes:
        # Routes attach from any namespace so each app owns its own HTTPRoute
        # next to its Deployment, rather than editing a central ingress file.
        namespaces:
          from: All
