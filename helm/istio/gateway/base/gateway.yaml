---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: localhost-gateway
  namespace: istio-system
spec:
  gatewayClassName: istio
  listeners:
    - name: http
      hostname: "*.localhost"
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      hostname: "*.localhost"
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            group: ""
            name: wildcard-localhost-tls
      allowedRoutes:
        # Routes attach from any namespace so each app owns its own HTTPRoute
        # next to its Deployment, rather than editing a central ingress file.
        namespaces:
          from: All
