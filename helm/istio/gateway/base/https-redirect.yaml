---
# Every plaintext request becomes a 301 to the same URL over TLS. Without this
# the platform happily served real content on port 80 - the labs teach
# certificate verification, and a student who reaches the app over http never
# sees a certificate at all.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  namespace: istio-system
spec:
  parentRefs:
    # group and kind are server defaults too; see the note on rules below.
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: localhost-gateway
      namespace: istio-system
      # Only the plaintext listener. Without sectionName this route would also
      # attach to :443 and redirect HTTPS to itself, which is a redirect loop.
      sectionName: http
  hostnames:
    - "*.localhost"
  rules:
    # This match is the API server's default, spelled out on purpose. Leave it
    # implicit and the server adds it to the live object, the live rules no
    # longer equal last-applied, and every apply rewrites the route and prints
    # "configured" for a file that has not changed - noise that reads as drift.
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
