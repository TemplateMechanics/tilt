---
# podinfo: a small Go web app built for exactly this. It has a UI, /healthz,
# /metrics for Prometheus, /env to show its environment, and it is the app the
# Flagger project uses for its own canary tutorials — so the same Deployment
# carries through to the later labs unchanged.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
  namespace: hello
  labels:
    app.kubernetes.io/name: hello
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hello
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hello
    spec:
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.9.1
          ports:
            - name: http
              containerPort: 9898
          env:
            - name: PODINFO_UI_MESSAGE
              value: "Hello from the platform"
            # Emit traces, so the Tempo panels on the AI Ops dashboard have
            # something in them. Without this Tempo ran, was wired up as a
            # datasource, and received nothing - two permanently empty panels that
            # read as "no slow requests" when the truth was "nobody sends spans".
            # podinfo enables tracing only when a service name is set, and reads
            # its flags from PODINFO_* env vars.
            - name: PODINFO_OTEL_SERVICE_NAME
              value: hello
            # OTLP/gRPC to Tempo. On the `minimal` profile Tempo does not exist;
            # the exporter drops spans and the app is unaffected.
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: http://tempo.tracing.svc.cluster.local:4317
            - name: OTEL_EXPORTER_OTLP_TRACES_INSECURE
              value: "true"
          # Probes are what turn "the container started" into "the app is
          # ready". Without readinessProbe, the Service sends traffic the moment
          # the process exists, and a slow-starting app returns errors for its
          # first few seconds.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
