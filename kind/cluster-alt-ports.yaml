# Same cluster as kind/cluster.yaml, but the gateway is published on 8443/8080.
#
# Use this ONLY when 443/80 are already taken on your machine. Nothing inside
# the cluster changes — Istio still listens on 443 — only the host-side port.
# Every URL then needs the port: https://<name>.localhost:8443.
#
#   KIND_CONFIG=kind/cluster-alt-ports.yaml GATEWAY_PORT=8443 ./scripts/platform.sh up
# platform.sh pairs that with GATEWAY_HTTP_PORT=8080 so certificates contain a
# reachable CRL URL. Set GATEWAY_HTTP_PORT explicitly for any custom mapping.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: tiltdev
nodes:
  - role: control-plane
    # Pinned by digest, as kind's release notes require ("You *must* use the
    # @sha256 digest to guarantee an image built for this release"). Without an
    # image line the version was whichever kind happened to be installed, so
    # the same file built different Kubernetes versions on different laptops.
    # This is kind v0.32.0's default for Kubernetes 1.36.1; it needs kind 0.32+.
    image: kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
      - containerPort: 30443
        hostPort: 8443
        protocol: TCP
  - role: worker
    image: kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5
