# kind cluster for this platform.
#
#   kind create cluster --config kind/cluster.yaml
#
# or just `make up`, which does this when the cluster is missing.
#
# This is the configuration every service in the repo was validated against.
# The README's Docker Desktop path uses the same manifests via the
# docker-desktop overlays, but kind is the reproducible option: it can be
# destroyed and rebuilt from empty in about a minute, which is what makes it
# safe to break things in.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: tiltdev
nodes:
  - role: control-plane
    # The Istio gateway is reached through a NodePort Service pinned to
    # 30080/30443 (helm/istio/gateway/overlays/kind). kind publishes those node
    # ports to the host here. There is no load balancer on kind, so without
    # this mapping the gateway is healthy and unreachable.
    #
    # Standard ports, so services are simply https://<name>.localhost. Istio
    # already listens on 443 inside the cluster; this is only the last hop from
    # the host. If something on your machine already owns 80/443 (another kind
    # cluster, a local web server), use kind/cluster-alt-ports.yaml instead:
    #   KIND_CONFIG=kind/cluster-alt-ports.yaml GATEWAY_PORT=8443 ./scripts/platform.sh up
    extraPortMappings:
      - containerPort: 30080
        hostPort: 80
        protocol: TCP
      - containerPort: 30443
        hostPort: 443
        protocol: TCP
  # A second node so scheduling, DaemonSets and node-level failures behave like
  # a real cluster rather than a single box. Both Alloy and ztunnel run per node;
  # with one node a learner never sees that.
  - role: worker
