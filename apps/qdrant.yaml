---
apiVersion: devplatform.systechs.io/v1alpha1
kind: DevApplication
metadata:
  name: qdrant
spec:
  name: qdrant
  domain: qdrant.localhost
  chart:
    name: qdrant
    # Pinned. A range re-resolves on every Flux reconcile, so the platform
    # rebuilt later is not the one built today. langfuse below is the worked
    # example: ">=0.1.0" jumped to chart 2.x and stopped installing.
    version: "1.19.1"
    repository: qdrant
    values:
      # Single replica for local dev
      replicaCount: 1
      # Persistent storage for vectors
      # No persistence.enabled or storageClass: chart 1.19.1 reads neither
      # (storage is always a PVC; the class key is storageClassName), and
      # changing them left the render identical.
      persistence:
        size: 10Gi
        accessModes:
          - ReadWriteOnce
      # Service configuration. Ports come from the chart's service.ports list
      # (6333 http, 6334 grpc); service.port and grpcPort were ignored.
      service:
        type: ClusterIP
      # Disable built-in ingress (the Crossplane composition creates an HTTPRoute)
      ingress:
        enabled: false
      # Resources (conservative for local dev)
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: 1000m
          memory: 2Gi
      # Config
      config:
        cluster:
          enabled: false
  ingress:
    enabled: true
    servicePort: 6333
