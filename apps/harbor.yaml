---
apiVersion: devplatform.systechs.io/v1alpha1
kind: DevApplication
metadata:
  name: harbor
  namespace: default
spec:
  name: harbor
  domain: harbor.localhost
  
  chart:
    repository: harbor
    name: harbor
    # 1.19.2 = Harbor 2.15.2. 1.15.1 was Harbor 2.11, which does not recognise
    # cosign signatures stored through the OCI 1.1 referrers API - the default
    # in cosign v3. Harbor shows such an image as unsigned while the signature
    # is sitting right there, which reads as "never signed".
    version: "1.19.2"
    values:
      expose:
        type: clusterIP
        tls:
          enabled: false
      externalURL: https://harbor.localhost
      persistence:
        enabled: false
      trivy:
        enabled: false
      # No `notary:` key: Harbor removed Notary in 2.12, and Helm ignores unknown
      # values without complaint, so disabling it read like a deliberate control
      # while doing precisely nothing.
      metrics:
        enabled: true
  
  ingress:
    enabled: true
    serviceName: harbor-portal
    servicePort: 80
  
  monitoring:
    enabled: true
    metrics: true
    logs: true
    traces: false
