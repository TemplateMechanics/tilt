---
apiVersion: devplatform.systechs.io/v1alpha1
kind: DevApplication
metadata:
  name: langfuse
spec:
  name: langfuse
  domain: langfuse.localhost
  chart:
    name: langfuse
    # PREREQUISITE, and the reason this does not install out of the box:
    # chart 2.x requires the ClickHouse Kubernetes operator to be present first —
    #   ClickHouse operator CRDs not found (clickhouse.com/v1alpha1/ClickHouseCluster)
    # ClickHouse is NOT a subchart in any 2.x release; only postgres and valkey
    # are. The langfuse chart's own values describe that operator as
    # "alpha-quality at the time of writing", so it is deliberately NOT added to
    # this platform to unblock one service that is disabled by default.
    #
    # To run langfuse, either:
    #   a) install the ClickHouse operator (clickhouse.com/v1alpha1), then enable
    #      this app; or
    #   b) set clickhouse.deploy: false below and point clickhouse.host at an
    #      external ClickHouse.
    #
    # Pinned rather than ranged: ">=0.1.0" resolved to 2.1.0, a major version
    # whose values are shaped completely differently, and the app silently
    # stopped installing.
    version: "2.1.0"
    repository: langfuse
    values:
      # Langfuse configuration
      langfuse:
        # Salt for hashing - use value subkey
        salt:
          value: "changeme-random-salt-value-here-32ch"
        # Encryption key (64 hex chars)
        encryptionKey:
          value: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
        # Feature flags
        features:
          telemetryEnabled: false
          signUpDisabled: false
        # NextAuth configuration
        nextauth:
          url: "https://langfuse.localhost"
          secret:
            value: "changeme-random-secret-min-32-chars!!"
      # PostgreSQL dependency (embedded)
      postgresql:
        enabled: true
        auth:
          username: langfuse
          password: langfuse
          database: langfuse
        primary:
          persistence:
            enabled: true
            size: 8Gi
      # ClickHouse dependency (required by newer Langfuse versions)
      clickhouse:
        enabled: true
        auth:
          # MUST be "default". The chart refuses to render otherwise:
          #   clickhouse.auth.username must be "default" when
          #   clickhouse.deploy is true
          # because the operator CR only provisions a password for the built-in
          # default user. With "langfuse" here the whole HelmRelease fails to
          # install, so langfuse never appears at all.
          username: default
          password: langfuse
        # Single node for dev environment (reduce resource usage)
        shards: 1
        replicaCount: 1
        zookeeper:
          replicaCount: 1
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 1Gi
      # Redis configuration
      redis:
        enabled: true
        auth:
          enabled: false  # Disable auth for dev simplicity
      # Service configuration
      service:
        type: ClusterIP
        port: 3000
      # Disable built-in ingress (Crossplane creates IngressRoute)
      ingress:
        enabled: false
      # Resources
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: 1000m
          memory: 1Gi
  ingress:
    enabled: true
    serviceName: langfuse-web
    servicePort: 3000