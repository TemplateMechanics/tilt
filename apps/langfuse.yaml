---
apiVersion: devplatform.systechs.io/v1alpha1
kind: DevApplication
metadata:
  name: langfuse
spec:
  name: langfuse
  domain: langfuse.localhost

  # Out of the ambient mesh. Every internal TCP connection langfuse makes - web
  # to postgres:5432, worker to redis:6379, clickhouse to zookeeper:2181 - hung
  # under ambient. ztunnel logged `bytes_sent=0 bytes_recv=0 ... connection timed
  # out` against the HBONE port and postgres logged no connection at all: the
  # request never arrived. A `nc -z` to the service still succeeded, because what
  # answered was ztunnel and not the database, so the port looked open while
  # nothing worked. Excluding the namespace fixed it immediately. The cause
  # inside ztunnel is not established; this is the fix, not the explanation.
  dataplaneMode: none
  chart:
    name: langfuse
    # Pinned rather than ranged: ">=0.1.0" resolved to 2.1.0, a major version
    # whose values are shaped completely differently, and the app silently
    # stopped installing.
    #
    # 1.5.41 (app 3.224.1), not 2.1.0 (app 4.24.0). Both need ClickHouse; every
    # published langfuse chart back to 0.12.x is app v3 or later. The difference
    # is where it comes from. 1.5.41 bundles the Bitnami clickhouse subchart, so
    # it installs with nothing else present. 2.x drops that subchart and fails
    # with "ClickHouse operator CRDs not found
    # (clickhouse.com/v1alpha1/ClickHouseCluster)" unless the ClickHouse
    # operator is installed first. The chart's own values call that operator
    # "alpha-quality at the time of writing", which is why it is not part of
    # this platform. Moving to 2.x means adding the operator, or setting
    # clickhouse.deploy: false and pointing clickhouse.host at an external
    # ClickHouse.
    version: "1.5.41"
    repository: langfuse
    values:
      # Langfuse configuration
      langfuse:
        # The web container was killed with SIGTERM (exit 143) on every start. It
        # was not crashing: the liveness probe fires 20s in with a 3-failure
        # threshold, and langfuse-web needs longer than that to finish its Postgres
        # and ClickHouse migrations on a laptop-sized cluster. Its log showed a
        # clean start-up right to the moment it was killed, which reads as a crash
        # and is not one.
        web:
          livenessProbe:
            initialDelaySeconds: 180
            failureThreshold: 10
          readinessProbe:
            initialDelaySeconds: 60
            failureThreshold: 20
        # Salt for hashing - use value subkey
        salt:
          value: "changeme-random-salt-value-here-32ch"
        # Encryption key (64 hex chars)
        encryptionKey:
          value: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
        # Feature flags
        features:
          telemetryEnabled: false
          signUpDisabled: false
        # NextAuth configuration
        nextauth:
          url: "https://langfuse.localhost"
          secret:
            value: "changeme-random-secret-min-32-chars!!"
      # PostgreSQL dependency (embedded). The chart's switch is `deploy`, not
      # `enabled`: this key once read `enabled: true`, which the chart ignores,
      # so `enabled: false` would have left the bundled database running.
      postgresql:
        deploy: true
        auth:
          username: langfuse
          password: langfuse
          database: langfuse
        primary:
          persistence:
            enabled: true
            size: 8Gi
      # ClickHouse dependency (Langfuse v3 and later). `deploy`, as for postgresql.
      clickhouse:
        deploy: true
        auth:
          # "default" is the chart's own default and the user this app was run
          # with. 1.5.41 renders with any name; 2.x refuses anything else
          # ("clickhouse.auth.username must be "default" when clickhouse.deploy
          # is true"), because its operator only provisions a password for the
          # built-in user. Keeping "default" avoids that trap on an upgrade.
          username: default
          password: langfuse
        # Single node for dev environment (reduce resource usage)
        shards: 1
        replicaCount: 1
        zookeeper:
          replicaCount: 1
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 1Gi
      # Redis configuration. `deploy`, as for postgresql; `enabled` was ignored.
      redis:
        deploy: true
        auth:
          enabled: false  # Disable auth for dev simplicity
      # Removed: top-level service, ingress and resources blocks. Chart 1.5.41
      # reads none of them (its keys are langfuse.web.service,
      # langfuse.ingress and langfuse.web/worker.resources), so rendering with
      # or without them, or with different values, gave identical manifests.
      # The 1Gi limit they described was never applied. Moving it to
      # langfuse.web.resources would cap a container that has only run
      # unbounded, during migrations that already outlast its probes, so it is
      # left for a change that can be tested on a cluster.
  ingress:
    enabled: true
    serviceName: langfuse-web
    servicePort: 3000