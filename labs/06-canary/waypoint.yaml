---
# Ambient splits L4 from L7. ztunnel gives you mTLS and TCP telemetry for free,
# but NOT per-request metrics: with no waypoint, `istio_requests_total` exists
# only with reporter="source" from the ingress gateway, and nothing at all for
# service-to-service traffic inside the namespace.
#
# Flagger's canary analysis asks for request-success-rate on the destination
# side. Without this waypoint it finds no series and halts with "no values found
# ... probably hello.hello is not receiving traffic" — then rolls back a
# perfectly healthy release. The traffic was real; nobody was measuring it.
#
# This is also the clearest demonstration of what a waypoint is for, which is
# why it belongs to the lab rather than to examples/hello-world: labs 01-03
# should show ambient with nothing extra in the path.
# The namespace is labelled with `kubectl label` (see the README), NOT
# declared here. It used to be: this file carried the full hello Namespace
# with istio.io/use-waypoint added. examples/hello-world/namespace.yaml
# declares the same Namespace without the label, and client-side apply removes
# labels that the last apply had and this one does not. So the next
# `kubectl apply -k examples/hello-world` (lab 02, the lab 06 exit, the
# pre-flight, Tilt on any hello edit) silently stripped the label. The waypoint
# kept running with nothing routed through it, and the canary rolled back as
# described above. `kubectl label` does not write last-applied, so a later
# apply leaves it alone.
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: waypoint
  namespace: hello
  labels:
    istio.io/waypoint-for: service
spec:
  gatewayClassName: istio-waypoint
  listeners:
    - name: mesh
      port: 15008
      protocol: HBONE
