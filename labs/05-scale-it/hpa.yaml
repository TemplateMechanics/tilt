---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hello
  namespace: hello
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hello
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          # Low on purpose so a laptop can trip it. The Deployment requests
          # 10m CPU, so ~5m of sustained load is 50%.
          averageUtilization: 50
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 30
